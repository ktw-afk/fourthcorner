<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member login — No Full Fares</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #fbfaf7; --ink: #1c1b18; --muted: #6b675f; --line: #e4e0d8; --accent: #1f3a5f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15140f; --ink: #f1ede4; --muted: #a39d92; --line: #2c2a24; --accent: #9fbbe0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px 56px; }
  h1 { font-size: 40px; line-height: 1.1; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 19px; margin: 0 0 40px; }
  h2 { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    margin: 40px 0 12px; font-family: system-ui, sans-serif; font-weight: 600; }
  p { margin: 0 0 16px; }
  ul { padding-left: 20px; margin: 0 0 16px; }
  li { margin-bottom: 8px; }
  a { color: var(--accent); }
  .cta { display: inline-block; margin-top: 8px; padding: 12px 18px; border: 1px solid var(--ink);
    color: var(--ink); text-decoration: none; font-family: system-ui, sans-serif; font-size: 16px; }
  footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 14px; font-family: system-ui, sans-serif; }
</style>
<style>
  form { display: grid; gap: 12px; max-width: 420px; margin: 8px 0 24px; font-family: system-ui, sans-serif; }
  label { font-size: 14px; color: var(--muted); }
  input { font: 16px system-ui, sans-serif; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); width: 100%; }
  button.cta { background: var(--ink); color: var(--bg); border: 0; cursor: pointer; }
  .note { font-family: system-ui, sans-serif; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Member login</h1>
  <p class="sub">Members sign in through the member home, where the feed and requests live.</p>
  <p><a class="cta" href="https://www.skool.com/login">Continue to member login</a></p>
  <p class="note">Sign in there with the email you joined with. Not a member? <a href="mailto:keenanworthington@gmail.com?subject=No%20Full%20Fares%20invite">Request an invite</a>.</p>
  <p><a href="index.html">Back</a></p>
  <footer>No Full Fares is operated by Fourth Corner LLC, California.</footer>
</main>
</body>
</html>
